name: Build & Release AutoKey

# Release uniquement sur tag v* (= version de Cargo.toml) ou lancement manuel.
# Chaque release publiée est proposée en mise à jour automatique à tous les utilisateurs.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # clé publique minisign intégrée dans l'appli (src/update.rs) : la signature produite doit la satisfaire
  MINISIGN_PUBKEY: RWRpMB1oOVO8oAhJTqnFniOXTkaykl7/VHz7aPE2WQodN+jhG6DtcX6V

jobs:
  build:
    runs-on: windows-latest
    outputs:
      build: ${{ steps.num.outputs.build }}
    env:
      AUTOKEY_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Le tag doit correspondre à la version de Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} différent de la version Cargo.toml (v$v)" }

      # Numéro comparé par l'updater (tag build-N) : toujours croissant, même si le workflow est recréé
      - name: Numéro de build
        id: num
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $last = 0
          foreach ($t in (gh release list --limit 200 --json tagName --jq '.[].tagName')) {
            if ($t -match '^build-(\d+)$') { $last = [Math]::Max($last, [int]$Matches[1]) }
          }
          $n = [Math]::Max($last + 1, [int]"${{ github.run_number }}")
          "AUTOKEY_BUILD=$n" >> $env:GITHUB_ENV
          "build=$n" >> $env:GITHUB_OUTPUT
          "Build n°$n" | Out-Host

      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Tests
        run: cargo test --release --locked

      - name: Compilation
        run: cargo build --release --locked

      - name: Préparer l'exe
        shell: pwsh
        run: Copy-Item target\release\autokey.exe AutoKey.exe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AutoKey
          path: AutoKey.exe
          if-no-files-found: error

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit
      - name: Audit de sécurité des dépendances (RustSec) — bloquant
        run: cargo audit

  release:
    needs: [build, audit]
    runs-on: ubuntu-latest
    # droits minimum : publier la release + attester la provenance de l'exe
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      N: ${{ needs.build.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: AutoKey

      - name: Empreinte SHA-256
        run: sha256sum AutoKey.exe | tee AutoKey.exe.sha256

      - name: Signature minisign
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        run: |
          if [ -z "$MINISIGN_KEY" ]; then echo "::error::secret MINISIGN_KEY manquant"; exit 1; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          umask 077
          printf '%s\n' "$MINISIGN_KEY" > "$RUNNER_TEMP/minisign.key"
          minisign -S -s "$RUNNER_TEMP/minisign.key" -m AutoKey.exe -x AutoKey.exe.minisig -t "AutoKey build $N"
          rm -f "$RUNNER_TEMP/minisign.key"
          minisign -V -P "$MINISIGN_PUBKEY" -m AutoKey.exe -x AutoKey.exe.minisig

      - name: Attestation de provenance (preuve que l'exe vient de ce dépôt)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: AutoKey.exe

      - name: Publier la release (déclenche la mise à jour dans l'appli)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # notes de la release : RELEASE_NOTES.md doit commencer par « # <version de Cargo.toml> »
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          first=$(head -n1 RELEASE_NOTES.md 2>/dev/null | tr -d '\r')
          if [ "$first" != "# $version" ]; then
            echo "::error::RELEASE_NOTES.md doit commencer par « # $version » (écrire les notes de cette version avant de publier)"
            exit 1
          fi
          changelog=$(grep -E '^- \[(fr|en|pt)\] ' RELEASE_NOTES.md | tr -d '\r' || true)
          notes="$changelog"$'\n\n'"Build n°$N (${GITHUB_REF_NAME}, commit ${GITHUB_SHA})."$'\n\n'"Vérifier l'empreinte : comparer avec AutoKey.exe.sha256."$'\n'"Vérifier la signature : minisign -Vm AutoKey.exe -P $MINISIGN_PUBKEY"$'\n'"Vérifier la provenance : gh attestation verify AutoKey.exe -R ${GITHUB_REPOSITORY}"
          gh release create "build-$N" AutoKey.exe AutoKey.exe.sha256 AutoKey.exe.minisig --title "AutoKey $version (build $N)" --notes "$notes" --latest
