name: Build & Release AutoKey

on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "assets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - ".github/workflows/**"
      - "!**/*.md"
  workflow_dispatch:

# droits minimum : publier la release + attester la provenance de l'exe
permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      AUTOKEY_REPO: ${{ github.repository }}
      AUTOKEY_BUILD: ${{ github.run_number }}
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Rust stable
        run: rustup update stable && rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Audit de sécurité des dépendances (RustSec)
        continue-on-error: true
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Tests
        run: cargo test --release --locked

      - name: Compilation
        run: cargo build --release --locked

      - name: Préparer l'exe et son empreinte SHA-256
        shell: pwsh
        run: |
          Copy-Item target\release\autokey.exe AutoKey.exe
          $h = (Get-FileHash AutoKey.exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("AutoKey.exe.sha256", "$h  AutoKey.exe`n")
          "SHA-256 : $h" | Out-Host

      - name: Attestation de provenance (preuve que l'exe vient de ce dépôt)
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: AutoKey.exe

      - uses: actions/upload-artifact@v4
        with:
          name: AutoKey
          path: |
            AutoKey.exe
            AutoKey.exe.sha256

      - name: Publier la release (déclenche la mise à jour dans l'appli)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $n = "${{ github.run_number }}"
          $notes = "Build automatique n°$n (commit ${{ github.sha }}).`n`nVérifier l'empreinte : comparer avec AutoKey.exe.sha256.`nVérifier la provenance : gh attestation verify AutoKey.exe -R ${{ github.repository }}"
          gh release create "build-$n" AutoKey.exe AutoKey.exe.sha256 --title "AutoKey build $n" --notes "$notes" --latest
