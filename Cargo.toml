[package]
name = "autokey"
version = "3.0.0"
edition = "2021"

[dependencies]
eframe = { version = "=0.29.1", default-features = false, features = ["glow", "default_fonts", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
# Compile aussi hors Windows (déclarations seules) : permet de vérifier le code Windows depuis Linux
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_Media",
  "Win32_Graphics_Dwm",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
wincheck = []
# Captures d'écran automatiques (dev uniquement)
shots = []

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
